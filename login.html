<!-- ================= login.html ================= -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-box">

        <h1>Campus Login</h1>

        <form id="loginForm">

            <input 
                type="email"
                id="loginEmail"
                placeholder="University Email"
                required
            >

            <input 
                type="password"
                id="loginPassword"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="bottom-links">

            <p>Don't have an account?</p>

            <a href="register.html">
                Register Here
            </a>

        </div>

    </div>

</body>

</html>
