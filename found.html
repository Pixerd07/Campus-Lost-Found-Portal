<div class="form-container">
  <h1>Report Found Item</h1>

  <form id="foundForm">

    <input type="text" id="finderName" placeholder="Your Name" required>

    <input type="text" id="foundItem" placeholder="Found Item Name" required>

    <input type="text" id="foundLocation" placeholder="Found Location" required>

    <input type="date" id="foundDate" required>

    <textarea id="foundDescription" placeholder="Item Description"></textarea>

    <input type="text" id="foundContact" placeholder="Phone / Email" required>

    <button type="submit">Submit</button>

  </form>
